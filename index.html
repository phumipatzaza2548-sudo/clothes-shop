<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - My Clothing Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

    <div class="auth-card">
        <h2>เข้าสู่ระบบ</h2>
        <p class="subtitle">ยินดีต้อนรับกลับเข้าสู่ร้านค้า</p>

        <form class="auth-form" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="username">ชื่อผู้ใช้</label>
                <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้" required>
            </div>
            <div class="input-group">
                <label for="password">รหัสผ่าน</label>
                <input type="password" id="password" placeholder="กรอกรหัสผ่าน" required>
            </div>
            <button type="submit" class="auth-btn">เข้าสู่ระบบ</button>
        </form>

        <div class="auth-footer">
            ยังไม่มีบัญชีใช่ไหม? <a href="register.html">สมัครสมาชิก</a>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            alert("เข้าสู่ระบบสำเร็จ!");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
<script>
    function handleLogin(e) {
        e.preventDefault();
        const username = document.getElementById("username").value;
        
        // บันทึกข้อมูลชื่อผู้ใช้
        localStorage.setItem("currentUser", username);
        
        alert("เข้าสู่ระบบสำเร็จ!");
        window.location.href = "index.html";
    }
</script>
