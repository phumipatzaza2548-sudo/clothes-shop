<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก - My Clothing Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #121212; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif;">

    <div class="auth-card" style="background-color: #1e1e1e; padding: 2.5rem 2rem; border-radius: 16px; width: 100%; max-width: 380px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); text-align: center; color: white;">
        
        <h2 style="font-size: 1.8rem; margin-bottom: 0.3rem; color: #ffffff;">สมัครสมาชิก</h2>
        <p style="font-size: 0.9rem; color: #aaa; margin-bottom: 1.8rem;">สร้างบัญชีใหม่เพื่อเริ่มช็อปปิ้ง</p>

        <form id="register-form" style="display: flex; flex-direction: column; gap: 1.2rem; text-align: left;">
            
            <!-- ชื่อผู้ใช้ -->
            <div>
                <label style="display: block; font-size: 0.9rem; margin-bottom: 0.4rem; font-weight: bold; color: #ddd;">ชื่อผู้ใช้</label>
                <input type="text" id="reg-username" placeholder="ตั้งชื่อผู้ใช้" required style="width: 100%; padding: 0.75rem 1rem; background-color: #2a2a2a; border: 1px solid #444; border-radius: 8px; color: #fff; font-size: 0.95rem; box-sizing: border-box; outline: none;">
            </div>

            <!-- อีเมล -->
            <div>
                <label style="display: block; font-size: 0.9rem; margin-bottom: 0.4rem; font-weight: bold; color: #ddd;">อีเมล</label>
                <input type="email" id="reg-email" placeholder="example@email.com" required style="width: 100%; padding: 0.75rem 1rem; background-color: #2a2a2a; border: 1px solid #444; border-radius: 8px; color: #fff; font-size: 0.95rem; box-sizing: border-box; outline: none;">
            </div>

            <!-- เบอร์โทรศัพท์ -->
            <div>
                <label style="display: block; font-size: 0.9rem; margin-bottom: 0.4rem; font-weight: bold; color: #ddd;">เบอร์โทรศัพท์</label>
                <input type="tel" id="reg-phone" placeholder="08X-XXX-XXXX" required style="width: 100%; padding: 0.75rem 1rem; background-color: #2a2a2a; border: 1px solid #444; border-radius: 8px; color: #fff; font-size: 0.95rem; box-sizing: border-box; outline: none;">
            </div>

            <!-- รหัสผ่าน -->
            <div>
                <label style="display: block; font-size: 0.9rem; margin-bottom: 0.4rem; font-weight: bold; color: #ddd;">รหัสผ่าน</label>
                <input type="password" id="reg-password" placeholder="ตั้งรหัสผ่าน" required style="width: 100%; padding: 0.75rem 1rem; background-color: #2a2a2a; border: 1px solid #444; border-radius: 8px; color: #fff; font-size: 0.95rem; box-sizing: border-box; outline: none;">
            </div>

            <button type="submit" style="width: 100%; padding: 0.8rem; background-color: #ffffff; color: #111111; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 0.5rem; transition: 0.2s;">ยืนยันลงทะเบียน</button>
        </form>

        <p style="font-size: 0.85rem; color: #aaa; margin-top: 1.5rem;">
            มีบัญชีอยู่แล้ว? <a href="login.html" style="color: #ffffff; text-decoration: underline; font-weight: bold;">เข้าสู่ระบบ</a>
        </p>
    </div>

    <!-- สคริปต์เมื่อกดลงทะเบียนแล้วเด้งไปหน้าเข้าสู่ระบบ -->
    <script>
        document.getElementById('register-form').addEventListener('submit', function(event) {
            event.preventDefault(); // ป้องกันหน้าเว็บรีเฟรช
            
            alert('ลงทะเบียนสำเร็จเรียบร้อยแล้ว!');
            window.location.href = 'index.html'; // เด้งไปยังหน้าเข้าสู่ระบบ
        });
    </script>

</body>
</html>
